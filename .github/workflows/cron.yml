name: Send pending certificates

on:
  schedule:
    # Fallback safety net — primary trigger is the icp-scheduler CF Cron (session-aware)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't send or mark as sent)"
        type: boolean
        default: false

# Two dispatches can arrive for the same tick (the icp-scheduler Worker's
# scheduled handler has no idempotency guard), which raced this job against
# itself and made the loser fail on push. Serialize instead of cancelling —
# the second run is harmless (it finds processed=0) and we want it to finish.
concurrency:
  group: send-pending-certificates
  cancel-in-progress: false

permissions:
  id-token: write       # required for WIF OIDC token
  contents: write       # required to commit refreshed data/certs.json

env:
  SHEET_ID: 1Z0dpILZColNERZU1t2XFImXX6cYTPT_vrkbJKpupaFs
  DRIVE_BACKUP_FOLDER_ID: 1__R6NI7co32HTebvgGVTw-3r8Gylh78I
  CERT_DELAY_MINUTES: "90"

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/998997004675/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: icp-cert-sender@icp-scheduling.iam.gserviceaccount.com

      - name: Run cert sender
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CERT_LOG_API_TOKEN: ${{ secrets.CERT_LOG_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python send_certs.py

      - name: Commit certs.json if changed
        if: ${{ !inputs.dry_run }}
        run: |
          if [ ! -f data/certs.json ]; then
            echo "data/certs.json not produced this run; nothing to commit"
            exit 0
          fi
          git config user.name "icp-cert-sender bot"
          git config user.email "actions@github.com"
          git add data/certs.json
          if git diff --cached --quiet; then
            echo "certs.json unchanged"
            exit 0
          fi
          git commit -m "Refresh certs.json [skip ci]"
          # Another run may have pushed while we worked; rebase and retry
          # rather than failing the whole job over a bookkeeping commit.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) - rebasing on origin/main"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push certs.json after 3 attempts" >&2
          exit 1
