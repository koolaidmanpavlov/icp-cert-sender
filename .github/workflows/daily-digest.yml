name: Daily cert-delivery digest

on:
  schedule:
    # 13:00 UTC = 9 AM EDT / 8 AM EST. Sends Andy a morning recap of yesterday.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  id-token: write       # required for WIF OIDC token
  contents: read

env:
  SHEET_ID: 1Z0dpILZColNERZU1t2XFImXX6cYTPT_vrkbJKpupaFs
  DRIVE_BACKUP_FOLDER_ID: 1__R6NI7co32HTebvgGVTw-3r8Gylh78I

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/998997004675/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: icp-cert-sender@icp-scheduling.iam.gserviceaccount.com

      - name: Run daily digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: andy@icp.us
        run: python digest.py
