name: Send one-off certificate

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: "Attendee full name (e.g., 'Chris Ratliff')"
        type: string
        required: true
      email:
        description: "Attendee email"
        type: string
        required: true
      course_key:
        description: "Course key (must match courses.json)"
        type: string
        required: true
      course_date:
        description: "Date string for cert (e.g., 'May 30, 2026')"
        type: string
        required: true
      course_date_iso:
        description: "Optional YYYY-MM-DD. Only needed if course_date isn't 'Month D, YYYY' — used to look up the session's delivery format in the scheduler."
        type: string
        required: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install resend Pillow requests

      - name: Render and send cert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ATTENDEE_NAME: ${{ inputs.full_name }}
          ATTENDEE_EMAIL: ${{ inputs.email }}
          COURSE_KEY: ${{ inputs.course_key }}
          COURSE_DATE: ${{ inputs.course_date }}
          COURSE_DATE_ISO: ${{ inputs.course_date_iso }}
        run: python send_one.py
